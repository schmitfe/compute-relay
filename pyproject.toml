[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-relay"
version = "0.1.0.dev0"
description = "A local compute broker for reviewed and budgeted Slurm jobs from AI clients"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "jsonschema==4.26.0",
  "rfc3339-validator>=0.1.4,<1",
  "rfc8785>=0.1.4,<1",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
  "waitress>=3.0.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-django>=4.10,<5", "build>=1.2,<2"]

[project.scripts]
compute-relay = "compute_relay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compute_relay = ["schemas/*.json", "control/templates/broker/*.html", "extensions/*/templates/*/*.html", "extensions/*/schemas/*.json", "mcp/resources/*.md"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "compute_relay.control.test_settings"
pythonpath = ["src", "tools", "tests"]
testpaths = ["tests"]
markers = [
  "real_cluster: opt-in operator acceptance, never selected by default",
  "container: requires an isolated Docker test stack",
]
addopts = "-m 'not real_cluster and not container'"

[tool.uv]
required-version = "==0.13.6"

[tool.compute-relay.ci]
python-versions = ["3.12", "3.13"]
