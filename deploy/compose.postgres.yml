name: compute-broker-postgres
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: broker_control
      POSTGRES_USER: broker
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${BROKER_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${BROKER_POSTGRES_SECRET_DIR:-../local/portal-postgres}/password:/run/secrets/database-password:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,nosuid,nodev,size=16m
    shm_size: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker_control"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
volumes:
  postgres-data:
