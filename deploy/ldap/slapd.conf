include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
include /etc/ldap/schema/nis.schema
include /opt/ldap-fixture/samba-fixture.schema
pidfile /tmp/broker-fixture-slapd.pid
argsfile /tmp/broker-fixture-slapd.args
modulepath /usr/lib/ldap
moduleload back_mdb
TLSCACertificateFile /run/ldap-fixture/ca.pem
TLSCertificateFile /var/lib/ldap-fixture/server.crt
TLSCertificateKeyFile /var/lib/ldap-fixture/server.key
TLSProtocolMin 3.3
security simple_bind=128
database mdb
maxsize 16777216
suffix "dc=fixture,dc=invalid"
rootdn "cn=fixture-admin,dc=fixture,dc=invalid"
directory /var/lib/ldap-fixture/data
index objectClass eq
index uid,entryUUID eq
access to attrs=userPassword
    by self auth
    by anonymous auth
    by * none
access to *
    by dn.exact="cn=broker-reader,dc=fixture,dc=invalid" read
    by users read
    by * none
