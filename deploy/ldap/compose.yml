{
  "services": {
    "ldap": {
      "build": {
        "context": "../..",
        "dockerfile": "deploy/ldap/Dockerfile",
        "target": "directory"
      },
      "hostname": "ldap-fixture",
      "networks": {
        "fixture": {
          "aliases": [
            "ldap-fixture",
            "ldap-wrong-name"
          ]
        }
      },
      "volumes": [
        "fixture-ca:/run/ldap-fixture",
        "fixture-data:/var/lib/ldap-fixture"
      ],
      "pids_limit": 128,
      "mem_limit": "256m",
      "cpus": 1,
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "LDAPTLS_CACERT=/run/ldap-fixture/ca.pem LDAPTLS_REQCERT=demand ldapwhoami -x -H ldaps://ldap-fixture:1636 -D cn=broker-reader,dc=fixture,dc=invalid -y /run/ldap-fixture/reader-password >/dev/null"
        ],
        "interval": "2s",
        "timeout": "3s",
        "retries": 30
      }
    },
    "acceptance": {
      "build": {
        "context": "../..",
        "dockerfile": "deploy/ldap/Dockerfile",
        "target": "acceptance"
      },
      "command": [
        "--confirm-disposable-fixture",
        "--ca-file",
        "/run/ldap-fixture/ca.pem",
        "--wrong-ca-file",
        "/run/ldap-fixture/wrong-ca.pem",
        "--bind-password-file",
        "/run/ldap-fixture/reader-password",
        "--user-password-directory",
        "/run/ldap-fixture"
      ],
      "volumes": [
        "fixture-ca:/run/ldap-fixture:ro"
      ],
      "networks": [
        "fixture"
      ],
      "depends_on": {
        "ldap": {
          "condition": "service_healthy"
        }
      },
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,size=64m,mode=1777"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ]
    }
  },
  "networks": {
    "fixture": {
      "internal": true
    }
  },
  "volumes": {
    "fixture-ca": {},
    "fixture-data": {}
  }
}
