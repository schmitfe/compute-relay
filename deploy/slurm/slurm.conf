# No cgroup or GPU containment claims: this fixture schedules tiny trusted tests.
ClusterName=broker-test
SlurmctldHost=slurm-fixture
SlurmUser=slurm
SlurmdUser=root
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
StateSaveLocation=/var/lib/slurm/slurmctld
SlurmdSpoolDir=/var/lib/slurm/slurmd
SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
SwitchType=switch/none
MpiDefault=none
MailProg=/bin/true
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
SlurmdParameters=config_overrides
ReturnToService=2
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=task=1
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurm-fixture
AccountingStoragePort=6819
AccountingStorageEnforce=associations
AccountingStoreFlags=job_comment
JobRequeue=0
KillWait=5
OverTimeLimit=0
MessageTimeout=10
MinJobAge=30
SlurmctldTimeout=30
SlurmdTimeout=30
NodeName=slurm-fixture CPUs=2 RealMemory=1024 State=UNKNOWN
PartitionName=debug Nodes=slurm-fixture Default=YES MaxTime=00:10:00 State=UP
