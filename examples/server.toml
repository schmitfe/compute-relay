# Proposed configuration shape only. All hosts and identities are placeholders.
profile = "server"
canonical_url = "https://compute.example.invalid"

[database]
engine = "postgresql"
connection_secret_file = "/run/secrets/postgresql_connection"

[storage]
engine = "filesystem"
root = "/var/lib/compute-broker/objects"

[identity]
provider = "oidc"
issuer = "https://identity.example.invalid/realms/research"
client_id = "compute-broker"
client_secret_file = "/run/secrets/oidc_client_secret"
require_independent_approval_channel = true

[worker]
private_api_url = "https://worker-api.example.invalid"
require_mutual_tls = true

[limits]
maximum_upload_bytes = 104857600
maximum_package_bytes = 268435456
maximum_files = 100
