name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    uses: ./.github/workflows/runtime.yml
    with:
      release_candidate: true
  slurm:
    uses: ./.github/workflows/slurm-fixture.yml

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: uv sync --locked --extra test --python 3.13
      - name: Require a merged release with matching versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          uv run --locked --extra test python - <<'PY'
          import os, tomllib
          from pathlib import Path
          from packaging.version import Version
          from compute_relay import __version__
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          parsed = Version(version)
          assert os.environ['RELEASE_TAG'] == 'v' + version == 'v' + __version__, 'Tag/package versions differ'
          assert not parsed.is_devrelease and parsed.local is None, 'Development builds cannot be published'
          assert (os.environ['RELEASE_PRERELEASE'] == 'true') == parsed.is_prerelease, 'Release prerelease flag differs'
          PY
      - name: Retain the archives verified by clean installation and restart
        run: uv run --locked --extra test python tools/package_smoke.py --dist-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [runtime, slurm, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/compute-relay
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
