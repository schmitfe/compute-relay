name: Optional disposable Slurm acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slurm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_FILE: deploy/compose.test.yml:deploy/compose.personal-test.yml:deploy/compose.upgrade-test.yml
      COMPOSE_PROJECT_NAME: cb-personal-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build synthetic cluster and acceptance client
        run: docker compose build control slurm personal-smoke upgrade-smoke
      - name: Start disposable services
        run: docker compose up -d --wait control slurm
      - name: Manage existing jobs across helper upgrades without resubmission
        run: docker compose run --rm --no-deps upgrade-smoke
      - name: Verify local pairing, SSH, reviewed Slurm execution and accounting
        run: docker compose run --rm --no-deps personal-smoke
      - name: Remove fixture state
        if: always()
        run: docker compose down --volumes --remove-orphans
