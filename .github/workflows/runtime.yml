name: Local package and SQLite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      BROKER_PROFILE: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the complete package and test tools
        run: python -m pip install -c requirements.lock '.[test]'
      - name: Unit, SQLite and local integration checks
        run: python -m pytest -q
      - name: Validate schemas and synthetic contracts
        run: python tools/check_contracts.py
      - name: Exercise reviewed and budgeted synthetic jobs
        run: |
          python tools/local_smoke.py
          python tools/local_smoke.py --mode budgeted
      - name: Check all bundled migrations
        run: BROKER_EXTENSIONS=storage,environments,workflows python -m django makemigrations --check --dry-run --settings=compute_relay.control.settings
      - name: Build and verify a clean installed wheel
        run: python tools/package_smoke.py
