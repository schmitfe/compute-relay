name: Runtime and disposable cluster

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c requirements.lock '.[test,mcp]'
      - run: python -m pytest -q
      - run: python tools/local_smoke.py
      - run: python tools/local_smoke.py --management
      - run: python tools/local_smoke.py --mode budgeted
      - run: python -m django makemigrations --check --dry-run --settings=compute_broker.control.settings
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        stack: [fake, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build synthetic images
        run: docker compose -f deploy/compose.${{ matrix.stack }}.yml --profile test build
      - name: Start synthetic stack
        run: docker compose -f deploy/compose.${{ matrix.stack }}.yml up -d --wait
      - name: Exercise approval and execution
        run: docker compose -f deploy/compose.${{ matrix.stack }}.yml --profile test run --rm smoke
      - name: Remove disposable services
        if: always()
        run: docker compose -f deploy/compose.${{ matrix.stack }}.yml down --volumes --remove-orphans
