{% if form.errors %}<div class="validation-summary" role="alert">
<strong>Check these fields:</strong><ul>
{% for field in form %}{% for error in field.errors %}<li>{% if field.is_hidden %}{{ field.label }}: {{ error }}{% else %}<a href="#field_{{ field.name }}">{{ field.label }}: {{ error }}</a>{% endif %}</li>{% endfor %}{% endfor %}
</ul>{{ form.non_field_errors }}</div>{% endif %}
