{% extends "broker/base.html" %}{% block content %}
<h1>Sign in to review compute requests</h1><p>Use the owner account created during setup. Project API keys are for agent requests.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}<label>Username <input name="username" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
{% endblock %}
