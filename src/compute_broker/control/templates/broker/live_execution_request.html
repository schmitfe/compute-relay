{% autoescape on %}<section data-live-review-request="{{ execution.id }}" data-execution-state="{{ execution.state }}"><h2>Execution request</h2><small class="execution-status">{{ execution.id }} · {{ execution.state }}</small>
<div class="execution-outcome">{% if execution.comment %}<p>{{ execution.comment }}</p>{% endif %}</div>
{% if execution.state == "awaiting_approval" %}<form method="post" action="/review/{{ job.id }}/">{% csrf_token %}<input type="hidden" name="execution_request_id" value="{{ execution.id }}"><input type="hidden" name="manifest_sha256" value="{{ detail.manifest_sha256 }}"><input type="hidden" name="idempotency_key" value="{{ idempotency_key }}"><label>Comment to the agent<textarea name="comment" maxlength="4000"></textarea></label><button name="decision" value="approve">Approve one execution</button><button class="reject" name="decision" value="reject">Reject with comment</button></form>{% endif %}</section>{% endautoescape %}
